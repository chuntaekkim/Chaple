<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더채플대치 발렛</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #12141c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #12141c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 70px;
        }
        /* 상단 헤더 */
        .header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4cd964;
        }
        .header .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4cd964;
            border-radius: 50%;
        }
        /* 콘텐츠 영역 */
        .content {
            padding: 20px;
            flex: 1;
        }
        .section-title {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 8px;
        }
        .main-card {
            background-color: #1a1d29;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .stat-desc {
            font-size: 13px;
            color: #aeaeb2;
            margin-bottom: 16px;
        }
        .card-row {
            display: flex;
            gap: 10px;
        }
        .sub-box {
            flex: 1;
            background-color: #242838;
            border-radius: 12px;
            padding: 12px 14px;
        }
        .sub-box-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sub-box-desc {
            font-size: 11px;
            color: #8e8e93;
        }
        /* 예식 차량 리스트 카드 */
        .event-card {
            background-color: #1a1d29;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            background-color: #007aff;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .info-label {
            color: #8e8e93;
        }
        .info-value {
            font-weight: 500;
        }
        .highlight-box {
            background-color: #2c241b;
            border: 1px solid #4a3820;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .highlight-box span:first-child {
            color: #f0a500;
        }
        /* 하단 네비게이션 바 */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: #12141c;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 20px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #8e8e93;
            font-size: 11px;
            gap: 4px;
        }
        .nav-item.active {
            color: #007aff;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 상단 헤더 -->
    <div class="header">
        <span>더채플대치 발렛</span>
        <div class="status">
            <div class="status-dot"></div>
            실시간 연동중
        </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="content">
        <div class="section-title">오늘 예식 현황</div>
        
        <div class="main-card">
            <div class="stat-number">2건</div>
            <div class="stat-desc">11:00 / 12:30 예식 진행 예정</div>
            
            <div class="card-row">
                <div class="sub-box">
                    <div class="sub-box-title">🅿️ 주차 안내</div>
                    <div class="sub-box-desc">후문 / 지하 4·5층</div>
                </div>
                <div class="sub-box">
                    <div class="sub-box-title">👑 임원 차량</div>
                    <div class="sub-box-desc">VIP 리스트</div>
                </div>
            </div>
        </div>

        <div class="section-title">🚗 타임별 예식 차량 & 상담·시식</div>

        <!-- 11:00 예식 카드 -->
        <div class="event-card">
            <div class="badge">11:00 예식</div>
            <div class="info-grid">
                <div><span class="info-label">신랑:</span> <span class="info-value">1234 (제네시스)</span></div>
                <div><span class="info-label">신부:</span> <span class="info-value">5678 (벤츠)</span></div>
                <div><span class="info-label">혼주3:</span> <span class="info-value">1111</span></div>
                <div><span class="info-label">혼주4:</span> <span class="info-value">2222</span></div>
            </div>
            <div class="highlight-box">
                <span>📌 [상담/시식 차량]</span>
                <span>9999 (그랜저) 외 1대</span>
            </div>
        </div>

        <!-- 12:30 예식 카드 -->
        <div class="event-card">
            <div class="badge">12:30 예식</div>
            <div class="info-grid">
                <div><span class="info-label">신랑:</span> <span class="info-value">3333 (카니발)</span></div>
                <div><span class="info-label">신부:</span> <span class="info-value">4444 (BMW)</span></div>
                <div><span class="info-label">혼주3:</span> <span class="info-value">5555</span></div>
                <div><span class="info-label">혼주4:</span> <span class="info-value">6666</span></div>
            </div>
            <div class="highlight-box">
                <span>📌 [상담/시식 차량]</span>
                <span>7777 (K8)</span>
            </div>
        </div>
    </div>

    <!-- 하단 탭 바 -->
    <div class="nav-bar">
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            오늘
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            일정
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.76l.12.34V17z"/></svg>
            주차
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/></svg>
            차량
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            연락
        </a>
    </div>
</div>

</body>
</html>
