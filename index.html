<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더채플엣대치 발렛</title>
    <meta name="theme-color" content="#0b0c10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png">

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #16181d;
            --card-hover: #1f2229;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --accent-color: #eab308;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 14px; padding-bottom: 90px; }
        
        .top-banner { font-size: 0.75rem; color: #f59e0b; margin-bottom: 8px; font-weight: bold; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 2px 4px; }
        .app-title { font-size: 1.05rem; font-weight: bold; color: var(--text-main); }
        .date-info { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 14px; }

        .page-section { display: none; }
        .page-section.active { display: block; }

        .card { background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-header { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
        
        /* 웨딩 카드 가로 스크롤 레이아웃 (동일 날짜 타임별 우측 추가) */
        .wedding-timeline-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; margin-top: 10px; }
        .wedding-slot-card { min-width: 260px; background: var(--card-hover); border-radius: 10px; padding: 14px; border: 1px solid var(--border-color); flex-shrink: 0; }
        .slot-time { background: var(--accent-color); color: #000; font-weight: bold; font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
        
        .couple-row { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin-bottom: 6px; }
        .side-box { width: 48%; }
        .side-title { font-size: 0.75rem; color: var(--accent-color); margin-bottom: 2px; }
        .detail-text { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
        .car-num { color: #60a5fa; font-weight: bold; font-size: 0.8rem; background: rgba(96,165,250,0.1); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }

        /* 하단 네비게이션 바 */
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #12141a; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-color); z-index: 100; }
        .nav-item { text-align: center; color: var(--text-sub); font-size: 0.7rem; text-decoration: none; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: var(--accent-color); font-weight: bold; }
        .nav-item span { display: block; font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="top-banner">⚠️ 더채플엣대치 발렛 (실시간 연동)</div>
    <header>
        <span class="app-title">더채플엣대치 발렛</span>
        <span id="current-date-text" style="font-size: 0.75rem; color: var(--text-sub);">로딩중...</span>
    </header>

    <!-- [1] 웨딩 & 차량 조회 섹션 -->
    <div id="sec-wedding" class="page-section active">
        <div class="date-info">구글 스프레드시트 연동 웨딩 스케줄</div>
        
        <div id="wedding-data-area">
            <div class="card" style="text-align: center; color: var(--text-sub); padding: 30px;">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </div>

    <!-- [2] 주차 안내 섹션 -->
    <div id="sec-parking" class="page-section">
        <div class="app-title" style="font-size: 1.1rem; margin-bottom: 4px;">주차 안내</div>
        <div style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px;">지하 4층 / 지하 5층 도면</div>
        
        <div class="card">
            <div style="font-weight: bold; color: var(--accent-color); margin-bottom: 6px;">🅿️ 지하 4층 주차 도면</div>
            <div style="background: var(--card-hover); padding: 20px; border-radius: 8px; text-align: center; color: var(--text-sub);">[지하 4층 도면 이미지 영역]</div>
        </div>
        <div class="card">
            <div style="font-weight: bold; color: var(--accent-color); margin-bottom: 6px;">🅿️ 지하 5층 주차 도면</div>
            <div style="background: var(--card-hover); padding: 20px; border-radius: 8px; text-align: center; color: var(--text-sub);">[지하 5층 도면 이미지 영역]</div>
        </div>
    </div>

    <!-- 하단 네비게이션 바 -->
    <nav>
        <button class="nav-item active" onclick="switchTab('wedding', this)"><span>📅</span>웨딩/차량</button>
        <button class="nav-item" onclick="switchTab('parking', this)"><span>🅿️</span>주차안내</button>
    </nav>

    <script>
        // ⚠️ 아래 URL을 본인이 배포한 구글 앱스 스크립트 웹 앱 URL로 변경하세요!
        const SCRIPT_URL ="https://script.google.com/macros/s/AKfycbyjz_CgYPnY36cOB8FnoBklpk77z27GNXrFWcAVPZ0Rz2y39DpS9Qm9LOdtav_ZSnSbBQ/exec";

        async function fetchWeddingData() {
            if (SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL")) {
                document.getElementById('wedding-data-area').innerHTML = `
                    <div class="card" style="text-align: center; color: #ef4444; padding: 20px;">
                        구글 앱스 스크립트 URL이 설정되지 않았습니다!<br>코드 내의 SCRIPT_URL을 수정해 주세요.
                    </div>`;
                return;
            }

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                renderWeddingSchedule(data);
            } catch (error) {
                console.error(error);
                document.getElementById('wedding-data-area').innerHTML = `
                    <div class="card" style="text-align: center; color: #ef4444; padding: 20px;">
                        데이터를 불러오는데 실패했습니다.
                    </div>`;
            }
        }

        function renderWeddingSchedule(rows) {
            const container = document.getElementById('wedding-data-area');
            container.innerHTML = '';

            if (!rows || rows.length === 0) {
                container.innerHTML = `<div class="card">등록된 예식 일정이 없습니다.</div>`;
                return;
            }

            // 날짜별로 데이터 그룹화
            let groupedByDate = {};
            rows.forEach(row => {
                let dateKey = row["날짜 (Date)"] || "기타 일정";
                if (!groupedByDate[dateKey]) groupedByDate[dateKey] = [];
                groupedByDate[dateKey].push(row);
            });

            // 날짜 카드 생성
            for (let date in groupedByDate) {
                let slots = groupedByDate[date];
                
                let cardHTML = `
                    <div class="card">
                        <div style="font-size: 0.95rem; font-weight: bold; color: var(--accent-color); margin-bottom: 4px;">📅 ${date} 예식 스케줄</div>
                        <div style="font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px;">시간별 신랑·신부 및 혼주 차량 정보</div>
                        <div class="wedding-timeline-container">
                `;

                slots.forEach(slot => {
                    let time = slot["예식 시간 (Time)"] || "";
                    let gName = slot["신랑 이름"] || "";
                    let bName = slot["신부 이름"] || "";
                    let gParents = slot["신랑 아버지/어머니"] || "";
                    let bParents = slot["신부 아버지/어머니"] || "";
                    let gCount = slot["신랑측 하객수"] || "0";
                    let bCount = slot["신부측 하객수"] || "0";
                    let gCar = slot["신랑측 혼주차량"] || "-";
                    let bCar = slot["신부측 혼주차량"] || "-";

                    cardHTML += `
                        <div class="wedding-slot-card">
                            <span class="slot-time">${time}</span>
                            <div class="couple-row">
                                <div style="width:48%;">신랑: ${gName}</div>
                                <div style="width:48%; text-align:right;">신부: ${bName}</div>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <div class="side-box">
                                    <div class="side-title">신랑측 부모</div>
                                    <div class="detail-text">${gParents}</div>
                                    <div class="side-title">하객수</div>
                                    <div class="detail-text">${gCount}명</div>
                                    <div class="side-title">혼주차량</div>
                                    <div><span class="car-num">${gCar}</span></div>
                                </div>
                                <div class="side-box" style="text-align:right;">
                                    <div class="side-title">신부측 부모</div>
                                    <div class="detail-text">${bParents}</div>
                                    <div class="side-title">하객수</div>
                                    <div class="detail-text">${bCount}명</div>
                                    <div class="side-title">혼주차량</div>
                                    <div><span class="car-num">${bCar}</span></div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                cardHTML += `</div></div>`;
                container.innerHTML += cardHTML;
            }
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('sec-' + tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            window.scrollTo(0, 0);
        }

        // 페이지 로딩 시 데이터 가져오기 실행
        window.onload = function() {
            const today = new Date();
            document.getElementById('current-date-text').innerText = `${today.getMonth()+1}.${today.getDate()} 실시간 연동`;
            fetchWeddingData();
        };
    </script>
</body>
</html>
