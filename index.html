<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웨딩 및 상담 통합 관리 시스템</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.8rem;
        }
        /* 탭 메뉴 스타일 */
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #e2e8f0;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        /* 필터 버튼 스타일 (월간용) */
        .filter-menu {
            display: none;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .filter-btn {
            padding: 6px 14px;
            font-size: 0.9rem;
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            cursor: pointer;
            background-color: white;
            color: var(--primary-color);
        }
        .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        /* 콘텐츠 박스 */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 20px;
            overflow-x: auto;
        }
        /* 테이블 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>웨딩 및 상담 통합 관리</h1>

    <!-- 메인 탭 메뉴 -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('monthly')">월간 웨딩 일정</button>
        <button class="tab-btn" onclick="switchTab('weekly')">주간 웨딩 일정</button>
        <button class="tab-btn" onclick="switchTab('consult')">상담 주간 일정</button>
    </div>

    <!-- 월간 웨딩용 서브 필터 (9월/10월) -->
    <div id="monthlyFilter" class="filter-menu">
        <button class="filter-btn active" onclick="filterMonthly('전체')">전체 보기</button>
        <button class="filter-btn" onclick="filterMonthly('9월')">9월</button>
        <button class="filter-btn" onclick="filterMonthly('10월')">10월</button>
    </div>

    <!-- 데이터 출력 카드 -->
    <div class="card">
        <div id="contentArea" class="loading">데이터를 불러오는 중입니다...</div>
    </div>
</div>

<script>
    // ⚠️ 아래에 본인의 구글 앱스 스크립트 웹 앱 URL을 넣어주세요!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmbcADVjlVq6xhVqos5QnSSEpA13ZYWwpwSHqcJG7xoq2ggIzXbCW4y-nO0JGXTTwH/exec";

    let currentTab = 'monthly';
    let rawMonthlyData = []; // 월간 전체 데이터 보관용
    let currentFilter = '전체';

    // 페이지 로드 시 기본 월간 데이터 호출
    window.onload = function() {
        fetchData('monthly');
    };

    // 탭 변경 함수
    function switchTab(tabType) {
        currentTab = tabType;
        
        // 버튼 활성화 디자인 변경
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // 월간 탭일 때만 9월/10월 필터 보이기
        const filterEl = document.getElementById('monthlyFilter');
        if (tabType === 'monthly') {
            filterEl.style.display = 'flex';
        } else {
            filterEl.style.display = 'none';
        }

        fetchData(tabType);
    }

    // 구글 앱스 스크립트에서 데이터 가져오기
    function fetchData(type) {
        const contentArea = document.getElementById('contentArea');
        contentArea.innerHTML = '<div class="loading">데이터를 불러오는 중입니다...</div>';

        fetch(`${SCRIPT_URL}?type=${type}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    contentArea.innerHTML = `<div class="loading" style="color:red;">에러: ${data.error}</div>`;
                    return;
                }
                
                if (type === 'monthly') {
                    rawMonthlyData = data;
                    renderMonthlyTable(rawMonthlyData);
                } else {
                    renderTable(data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                contentArea.innerHTML = '<div class="loading" style="color:red;">데이터를 불러오는 데 실패했습니다. URL을 확인해 주세요.</div>';
            });
    }

    // 일반 테이블 렌더링 (Weekly, Consult 용)
    function renderTable(data) {
        const contentArea = document.getElementById('contentArea');
        if (!data || data.length === 0) {
            contentArea.innerHTML = '<div class="loading">데이터가 없습니다.</div>';
            return;
        }

        let html = '<table><thead><tr>';
        const headers = Object.keys(data[0]);
        headers.forEach(h => {
            html += `<th>${h}</th>`;
        });
        html += '</tr></thead><tbody>';

        data.forEach(row => {
            html += '<tr>';
            headers.forEach(h => {
                html += `<td>${row[h] !== undefined ? row[h] : ''}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table>';

        contentArea.innerHTML = html;
    }

    // 월간 데이터 렌더링 (필터 적용 포함)
    function renderMonthlyTable(data) {
        let filteredData = data;
        if (currentFilter !== '전체') {
            filteredData = data.filter(row => row['월'] === currentFilter);
        }
        renderTable(filteredData);
    }

    // 월간 필터 버튼 클릭 시
    function filterMonthly(month) {
        currentFilter = month;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderMonthlyTable(rawMonthlyData);
    }
</script>

</body>
</html>
