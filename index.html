<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더채플엣대치 발렛</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .header {
            padding: 15px 20px 5px 20px;
            font-size: 13px;
            color: #aaaaaa;
        }
        .title-area {
            padding: 0 20px 15px 20px;
        }
        .title-area h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }
        .section-desc {
            padding: 0 20px 15px 20px;
            font-size: 13px;
            color: #cccccc;
        }
        .tab-container {
            display: flex;
            background-color: #1e1e1e;
            margin: 0 20px;
            border-radius: 10px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            color: #888888;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab.active {
            background-color: #ffc107;
            color: #000000;
        }
        .content-card {
            background-color: #1e1e1e;
            margin: 20px;
            border-radius: 12px;
            padding: 20px;
        }
        .alert-box {
            background-color: #2c1a1a;
            border-left: 4px solid #ff5252;
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.4;
            color: #ff8a80;
        }
        .alert-box strong {
            color: #ff5252;
            display: block;
            margin-bottom: 4px;
        }
        .image-container {
            width: 100%;
            text-align: center;
        }
        .image-container img {
            width: 100%;
            max-width: 100%;
            border-radius: 8px;
            display: block;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #181818;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #282828;
            box-sizing: border-box;
        }
        .nav-item {
            text-align: center;
            color: #888888;
            font-size: 11px;
            text-decoration: none;
            flex: 1;
        }
        .nav-item.active {
            color: #ffc107;
        }
        .nav-item div:first-child {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">더채플엣대치 발렛</div>
    <div class="title-area">
        <h1>주차 안내</h1>
    </div>
    
    <div class="section-desc">구역별 주차 수칙 및 도면 안내입니다.</div>

    <!-- 탭 메뉴 -->
    <div class="tab-container">
        <div class="tab active" onclick="switchTab('b4')">지하 4층</div>
        <div class="tab" onclick="switchTab('b5')">지하 5층</div>
        <div class="tab" onclick="switchTab('back')">후문</div>
    </div>

    <!-- 지하 4층 내용 -->
    <div id="content-b4" class="tab-content active">
        <div class="content-card">
            <div class="alert-box">
                <strong>지하 4층 · 지정주차구역 준수</strong>
                냉장고 및 창고 앞 발렛주차 절대 불가. 지정구역 외 주차 금지 및 이중주차 가능
            </div>
            <div class="image-container">
                <img src="Chaple_B4.png" alt="지하 4층 도면">
            </div>
        </div>
    </div>

    <!-- 지하 5층 내용 -->
    <div id="content-b5" class="tab-content">
        <div class="content-card">
            <div class="alert-box">
                <strong>지하 5층 · 주차 안내</strong>
                지하 5층 구역별 주차 수칙을 준수해 주세요.
            </div>
            <div class="image-container">
                <img src="Chaple_B5.png" alt="지하 5층 도면">
            </div>
        </div>
    </div>

    <!-- 후문 내용 -->
    <div id="content-back" class="tab-content">
        <div class="content-card">
            <div class="alert-box">
                <strong>후문 · 안내 사항</strong>
                후문 구역 입출차 및 주차 수칙 안내입니다.
            </div>
            <div class="image-container" style="color: #888; padding: 40px 0;">
                후문 도면 이미지가 준비중입니다.
            </div>
        </div>
    </div>

    <!-- 하단 네비게이션 -->
    <div class="bottom-nav">
        <a href="#" class="nav-item">
            <div>⏰</div>
            <div>오늘</div>
        </a>
        <a href="#" class="nav-item">
            <div>📅</div>
            <div>일정</div>
        </a>
        <a href="#" class="nav-item active">
            <div>🅿️</div>
            <div>주차</div>
        </a>
        <a href="#" class="nav-item">
            <div>🚗</div>
            <div>차량</div>
        </a>
        <a href="#" class="nav-item">
            <div>📞</div>
            <div>연락</div>
        </a>
    </div>

    <script>
        function switchTab(target) {
            // 탭 버튼 active 전환
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            if(target === 'b4') tabs[0].classList.add('active');
            if(target === 'b5') tabs[1].classList.add('active');
            if(target === 'b'] || target === 'back') tabs[2].classList.add('active');

            // 내용 컨텐츠 active 전환
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById('content-' + target).classList.add('active');
        }
    </script>
</body>
</html>
